[project]
name = "global-news-radar"
version = "1.1.0"
description = "Real-time, source-verified financial event radar for Telegram"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "defusedxml==0.7.1",
  "PyYAML==6.0.2",
  "requests==2.32.4",
]

[project.urls]
Homepage = "https://github.com/EricEEEEEEE/global-news-radar"
Repository = "https://github.com/EricEEEEEEE/global-news-radar"
Issues = "https://github.com/EricEEEEEEE/global-news-radar/issues"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
