version: "1.8.0"
timezone: Asia/Singapore
poll_seconds: 120
freshness_minutes: 75
future_tolerance_minutes: 5
topic_cooldown_hours: 6
topic_retention_days: 30
item_retention_days: 7
delivery_retention_days: 90
lineage_max_gap_days: 7
anchor_min_interval_minutes: 30
anchor_daily_cap: 6
corroboration_minutes: 20
p1_window_minutes: 120
p1_expiry_minutes: 180
# A P1 batch normally waits for a second entry; after this many minutes a
# lone entry sends by itself instead of expiring unseen.
p1_solo_after_minutes: 60
quiet_window:
  start: "21:00"
  end: "21:30"
telegram:
  chat_id: "0"
  news_thread_id: "0"
  monitor_thread_id: "0"
  # Delivery-level ceiling, sized for the sectioned brief, which is a plain
  # text message (4096 visible chars) and no longer a photo caption (1024).
  # 1.8.0 moved the cover image to its own short-caption message so the brief
  # itself is free to use the text budget. Alerts keep their tight budget.
  max_visible_chars: 4000
  alert_visible_chars: 400
runtime:
  baseline_on_first_run: true
  # Consecutive-failure thresholds are counts, and the wall-clock they buy
  # depends on how often the source is polled. Official feeds run every cycle
  # (2 min), so 3 is ~6 minutes; FMP runs every structured.interval_cycles.
  # Discovery feeds run every discovery.interval_cycles (10 min), so 3 was only
  # 30 minutes of a commercial CDN hiccup -- 6 makes it a full hour before one
  # of eleven discovery feeds is allowed to interrupt.
  source_failure_alert_after: 3
  source_failure_alert_after_discovery: 6
  # After a recovery is announced the incident is closed, so a new outage may
  # alert again. This gap keeps a flapping source from alerting every bounce.
  source_realert_minutes: 60
  source_failure_alert_rate: 0.5
  source_failure_rate_min_calls: 4
  source_health_window_hours: 6
  source_error_cooldown_hours: 12
  source_retry_attempts: 2
  delivery_retry_minutes: 10
  delivery_max_attempts: 6
  # The watchdog runs from cron every few minutes. A dead daemon stays dead
  # until someone acts, so repeating the alarm every run only trains the
  # operator to ignore it; one alert per outage plus a recovery notice is the
  # whole signal.
  watchdog_alert_cooldown_hours: 6
llm:
  enabled: false
  model: ""
  timeout_seconds: 35
  max_output_tokens: 400
# Comic rendering for alerts: the picture carries mood and domain only, every
# fact stays in the caption text. Generation failure falls back to plain text
# and is counted in cycle stats. Ships disabled, like every optional call.
comic:
  enabled: false
  image_model: grok-imagine-image
  scene_timeout_seconds: 45
  image_timeout_seconds: 150
# Editorial picks of interesting, high-attention world stories from
# major-source headlines that matched no rule category. The judge only
# selects; what is sent is the verbatim headline through the summarizer.
trending:
  enabled: false
  max_per_day: 3
  timeout_seconds: 45
# Story clustering: one story filed by many outlets is one unit of work, not
# many. A cluster where burst_min_majors distinct major outlets all file
# within burst_window_minutes is world news by definition and is promoted to
# an instant P0 whether or not any vocabulary rule matched it.
clusters:
  window_hours: 12
  min_shared_tokens: 3
  burst_min_majors: 3
  burst_window_minutes: 90
  # Second-chance merge for the same story written in different words, e.g.
  # "quake" vs "earthquake". Only consulted when token overlap already failed,
  # so it can merge more but never less. model2vec runs locally on CPU with no
  # network call -- the LLM gateway serves no embedding model.
  #
  # 0.72 is measured, not guessed. Replaying 2170 real clusters, it fires on
  # 12 of them: nine are the same story split by wording (two Indonesia quake
  # filings, four cyclospora/salmonella outbreak filings, "US sanctions more
  # Cuban companies" vs "US imposes sanctions on nine Cuban entities"), one is
  # wrong ("Why is EQT Holdings stock surging today?" pulled into the same
  # sentence about NRW Holdings -- a wire template, not a story), and two are
  # arguable. Loosening to 0.65 quadruples the count and the extra ones are
  # mostly template collisions. Requires the optional model2vec dependency;
  # a missing or broken model degrades silently back to token overlap.
  embedding:
    enabled: true
    model: minishlab/potion-base-8M
    threshold: 0.72
# Twice-daily world briefs, the guaranteed product of the radar day: morning
# covers the overnight window, evening covers the day. Ships disabled like
# every optional feature; the VPS flips it on via RADAR_BRIEFS_ENABLED.
briefs:
  enabled: false
  morning_sgt: "07:30"
  evening_sgt: "20:30"
  max_items: 10
  max_visible_chars: 3500
  comic: true
  timeout_seconds: 60
  # How many clusters to rank before the domain quotas pick from them. Packing
  # 10 slots out of only 10 candidates is not a choice; 5x gives the quotas a
  # real pool to balance the day out of.
  candidate_multiplier: 5

# Section layout for the brief. The quotas are caps, not floors: they stop one
# loud event owning the whole brief, and on a quiet day the second packing pass
# ignores them so unused slots still go to the highest-ranked stories.
# Classification is keyword-first and deterministic; the LLM pass, when enabled,
# may only override with a label from this same list and fails open to keywords.
domains:
  llm_enabled: false
  model: ""
  timeout_seconds: 30
  quotas:
    disaster: 2
    politics: 3
    economy: 2
    science: 1
    tech: 1
    society: 1
    sport: 1
    other: 1
  # Feeds that only ever publish one domain. Their id is a stronger signal
  # than vocabulary: measured on 48 live sport headlines, keyword matching
  # reached 18, because the rest name teams and players rather than the sport.
  # A hint only breaks a tie -- two or more keyword cues still win -- so a
  # stadium collapse filed by a sport desk still reads as a disaster.
  source_hints:
    usgs_quakes: disaster
    gdacs_24h: disaster
    who_news: science
    sciencedaily_top: science
    bbc_science: science
    bbc_tech: tech
    arstechnica: tech
    bbc_sport: sport
    guardian_sport: sport
    coindesk: economy
    marketwatch_realtime: economy
    investing_news: economy
    cnbc_economy: economy
official_feeds:
  - id: fed_all
    name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
    region: us
    category_hint: central_bank
  - id: fed_monetary
    name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    region: us
    category_hint: central_bank
  - id: ecb_press
    name: European Central Bank
    url: https://www.ecb.europa.eu/rss/press.html
    region: eu
    category_hint: central_bank
  - id: sec_press
    name: U.S. SEC
    url: https://www.sec.gov/news/pressreleases.rss
    region: us
    category_hint: regulation
  - id: cftc_general
    name: U.S. CFTC
    url: https://www.cftc.gov/RSS/RSSGP/rssgp.xml
    region: us
    category_hint: regulation
  - id: cftc_enforcement
    name: U.S. CFTC
    url: https://www.cftc.gov/RSS/RSSENF/rssenf.xml
    region: us
    category_hint: regulation
  - id: boj_news
    name: Bank of Japan
    url: https://www.boj.or.jp/rss/whatsnew.xml
    region: asia
    category_hint: central_bank
discovery:
  enabled: true
  interval_cycles: 5
  # 4 = breaking finance, crypto, the rotating regional slot, and the world
  # slot (disasters, conflicts, outbreaks) added in 1.7.0.
  max_queries: 4
  gdelt_fallback: true
  # Google News alone silences the radar whenever it rate-limits or reshapes its
  # RSS: fall back to GDELT when discovery returns a thin batch, not only an
  # empty one.
  gdelt_min_items: 8
  major_sources:
    - Reuters
    - Associated Press
    - Bloomberg
    - Financial Times
    - CNBC
    - Wall Street Journal
    - MarketWatch
    - South China Morning Post
    - BBC
    - Al Jazeera
    - Channel NewsAsia
    - Yonhap
    - Japan Times
  # Direct outlet feeds, so corroboration no longer depends on Google News
  # surfacing the same story twice. Every URL below was probed from the VPS and
  # returns parseable, dated entries.
  feeds:
    - id: cnbc_top
      name: CNBC
      url: https://www.cnbc.com/id/100003114/device/rss/rss.html
      region: us
      category_hint: discovery
    - id: cnbc_economy
      name: CNBC
      url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
      region: us
      category_hint: discovery
    - id: marketwatch_realtime
      name: MarketWatch
      url: https://feeds.content.dowjones.io/public/rss/mw_realtimeheadlines
      region: us
      category_hint: discovery
    - id: ft_home
      name: Financial Times
      url: https://www.ft.com/rss/home
      region: global
      category_hint: discovery
    - id: bbc_business
      name: BBC
      url: https://feeds.bbci.co.uk/news/business/rss.xml
      region: global
      category_hint: discovery
    - id: bbc_world
      name: BBC
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      region: global
      category_hint: discovery
    - id: aljazeera_all
      name: Al Jazeera
      url: https://www.aljazeera.com/xml/rss/all.xml
      region: global
      category_hint: discovery
    - id: scmp_business
      name: South China Morning Post
      url: https://www.scmp.com/rss/92/feed
      region: asia
      category_hint: discovery
    - id: investing_news
      name: Investing.com
      url: https://www.investing.com/rss/news.rss
      region: global
      category_hint: discovery
    - id: coindesk
      name: CoinDesk
      url: https://www.coindesk.com/arc/outboundfeeds/rss/
      region: global
      category_hint: discovery
    - id: cna_top
      name: Channel NewsAsia
      url: https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml
      region: asia
      category_hint: discovery
    - id: yonhap_news
      name: Yonhap
      url: https://en.yna.co.kr/RSS/news.xml
      region: asia
      category_hint: discovery
    - id: japantimes_all
      name: Japan Times
      url: https://www.japantimes.co.jp/feed/
      region: asia
      category_hint: discovery
    # 1.8.0 domain supply. The brief is sectioned by domain now, and the old
    # feed list was almost entirely finance: disaster, science, tech, sport and
    # non-US politics had no dedicated source to be selected from. Every URL
    # below was probed from the VPS and returned parseable, dated entries.
    # BBC sub-feeds keep name "BBC" on purpose: major_count counts DISTINCT
    # source names, so "BBC Sport" as its own name would let one outlet supply
    # two of the three majors a burst promotion needs.
    - id: usgs_quakes
      name: USGS
      url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.atom
      region: global
      category_hint: discovery
    - id: gdacs_24h
      name: GDACS
      url: https://www.gdacs.org/xml/rss_24h.xml
      region: global
      category_hint: discovery
    - id: who_news
      name: World Health Organization
      url: https://www.who.int/rss-feeds/news-english.xml
      region: global
      category_hint: discovery
    - id: sciencedaily_top
      name: ScienceDaily
      url: https://www.sciencedaily.com/rss/top/science.xml
      region: global
      category_hint: discovery
    - id: bbc_science
      name: BBC
      url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
      region: global
      category_hint: discovery
    - id: bbc_tech
      name: BBC
      url: https://feeds.bbci.co.uk/news/technology/rss.xml
      region: global
      category_hint: discovery
    - id: arstechnica
      name: Ars Technica
      url: https://feeds.arstechnica.com/arstechnica/index
      region: global
      category_hint: discovery
    - id: bbc_sport
      name: BBC
      url: https://feeds.bbci.co.uk/sport/rss.xml
      region: global
      category_hint: discovery
    - id: guardian_sport
      name: The Guardian
      url: https://www.theguardian.com/sport/rss
      region: global
      category_hint: discovery
    - id: guardian_world
      name: The Guardian
      url: https://www.theguardian.com/world/rss
      region: global
      category_hint: discovery
    - id: npr_world
      name: NPR
      url: https://feeds.npr.org/1004/rss.xml
      region: us
      category_hint: discovery
    - id: cbc_world
      name: CBC
      url: https://www.cbc.ca/webfeed/rss/rss-world
      region: americas
      category_hint: discovery
    - id: france24_en
      name: France 24
      url: https://www.france24.com/en/rss
      region: eu
      category_hint: discovery
    - id: politico_eu
      name: Politico Europe
      url: https://www.politico.eu/feed/
      region: eu
      category_hint: discovery
structured:
  fmp_enabled: false
  interval_cycles: 5
  # Percentage-point series only. Index-level releases (ISM, PMI) are
  # deliberately excluded: their surprises are measured in index points, which
  # the shared rate_surprise_pp threshold would read as a shock every month.
  macro_events:
    - consumer price index
    - cpi
    - inflation rate
    - core inflation rate
    - pce price index
    - nonfarm payroll
    - non-farm payroll
    - unemployment rate
    - gross domestic product
    - gdp
    - interest rate decision
  # A 0.2pp miss on CPI or the unemployment rate already moves the curve; 0.3
  # silently dropped most real macro surprises.
  rate_surprise_pp: 0.2
  count_relative_surprise: 0.3
